[project]
name = "pretix-apicustomerlogin"
dynamic = ["version"]
description = "Short description"
readme = "README.rst"
license = {text = "Apache"}
keywords = ["pretix"]
authors = [
    {name = "XenonCloud", email = "your-email@example.org"},
]
maintainers = [
    {name = "XenonCloud", email = "your-email@example.org"},
]

dependencies = [
]

[project.entry-points."pretix.plugin"]
pretix_apicustomerlogin = "pretix_apicustomerlogin:PretixPluginMeta"

[project.entry-points."distutils.commands"]
build = "pretix_plugin_build.build:CustomBuild"

[build-system]
requires = [
    "setuptools",
    "pretix-plugin-build",
]

[project.urls]
homepage = "https://github.com/xenoncloud/pretix-apicustomerlogin"
repository = "https://github.com/xenoncloud/pretix-apicustomerlogin"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "pretix_apicustomerlogin.__version__"}

[tool.setuptools.packages.find]
include = ["pretix*"]
namespaces = false
